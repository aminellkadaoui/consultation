<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>استشارة المحتوى · قبل المكالمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Thmanyah Sans';src:url('fonts/thmanyah-sans-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url('fonts/thmanyah-sans-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Thmanyah Sans';src:url('fonts/thmanyah-sans-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Thmanyah Serif Display';src:url('fonts/thmanyah-serif-display-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}

:root{
  --brand:#0f6bff;--brand-ink:#0056d6;--btn:#0066ff;--ink:#111318;--soft:#4f5665;--faint:#7f8797;
  --line:#e5e9f1;--bg:#f5f7fb;--card:#fff;--err:#c93f36;--ok:#12865a;
  --ar:'Thmanyah Sans','IBM Plex Sans Arabic',sans-serif;--mono:'IBM Plex Mono',monospace;
  --t-fast:170ms;--t-med:300ms;--fast:var(--t-fast);--med:var(--t-med);--ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.22,1,.36,1)
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{font-family:var(--ar);background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:focus-visible{outline:2.5px solid rgba(15,107,255,.42);outline-offset:2px;border-radius:8px}
.bar{position:fixed;top:0;left:0;right:0;z-index:30;height:3px;background:rgba(15,107,255,.08)}
.bar i{display:block;height:100%;width:0;background:var(--brand);border-radius:0 3px 3px 0;transition:width var(--t-med) var(--spring)}
.stage-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:38px clamp(14px,4vw,26px)}
.stage{width:100%;max-width:600px}
.slide,.state-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px clamp(18px,3vw,26px) 18px;box-shadow:0 18px 50px -42px rgba(25,38,72,.32)}
.slide{display:flex;flex-direction:column}
.slide.in{animation:rise .3s var(--ease) both}
.slide.out{animation:sink .14s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sink{from{opacity:1}to{opacity:0}}
.cstep{font-family:var(--mono);font-size:11px;color:var(--faint);direction:ltr;margin-bottom:10px;letter-spacing:.03em}
.cstep b{color:var(--brand-ink)}
.qh{font-family:'Thmanyah Serif Display',serif;font-size:clamp(18px,3vw,22px);line-height:1.45;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.hint{font-size:14px;color:#171a20;margin-top:7px;line-height:1.7;font-weight:500;text-wrap:pretty}
.req{color:var(--brand)}
.field{margin-top:16px;overflow:visible;padding-inline-end:0}
.field::-webkit-scrollbar{display:none}
.slide.business-step .field{margin-top:16px}
.slide.business-step textarea.tin{min-height:90px}
.block{margin-top:14px}.block:first-child{margin-top:0}
.sublabel{font-size:13.5px;font-weight:650;color:#303642;margin-bottom:6px}
.subhint{font-size:12.5px;color:var(--faint);margin:-2px 0 8px}
.tin{width:100%;font-family:var(--ar);font-size:14.5px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.tin::placeholder{color:#929bad;opacity:1}.tin:hover{border-color:#d3d7e2}.tin:focus{border-color:var(--brand);box-shadow:0 0 0 3.5px rgba(15,107,255,.13)}.tin.bad{border-color:#e6a9a4;box-shadow:0 0 0 3.5px rgba(208,72,63,.10)}
textarea.tin{min-height:0;resize:none;overflow:hidden;line-height:1.75}.short textarea.tin{min-height:0}
.tin[dir=ltr]{direction:ltr;text-align:left;font-family:var(--mono);font-size:14px}
.formula{background:#f7f9fd;border:1px solid #dde5f2;border-radius:13px;padding:13px 15px;margin:13px 0 2px;color:#353b47;font-size:13.5px;line-height:1.85}
.formula::before{content:"صيغة تساعدك";display:block;color:#697284;font-size:12.5px;font-weight:650;margin-bottom:7px}
.formula b{color:var(--brand-ink);font-weight:700}
.example{margin-top:14px;border-top:1px solid #e8ecf3;padding-top:12px}
.example summary{list-style:none;cursor:pointer;color:#3e4655;font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px;user-select:none}
.example summary::-webkit-details-marker{display:none}.example summary::before{content:"+";color:var(--brand);font-size:18px;line-height:1;transition:transform var(--t-fast) var(--ease)}
.example[open] summary::before{transform:rotate(45deg)}
.example .example-body{margin-top:10px;background:#f7f9fd;border:1px solid #e7ecf4;border-radius:12px;padding:12px 14px;color:#3e4655;font-size:13.5px;line-height:1.8}
.opts{display:flex;flex-direction:column;gap:8px}.opts.cols{display:grid;grid-template-columns:1fr 1fr}
.opt{position:relative;display:flex;align-items:center;gap:11px;min-height:46px;padding:10px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;user-select:none;touch-action:manipulation;transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.opt:hover{border-color:#cfd3e0;background:#fafbff}.opt:active{background:#eef4ff}.opt.sel{border-color:var(--brand);background:rgba(15,107,255,.055)}
.opt input{position:absolute;opacity:0;pointer-events:none}.opt .tx{flex:1;font-size:14px;font-weight:500;color:#2c313b}
.tick{width:18px;height:18px;border:2px solid #d1d6e2;border-radius:50%;position:relative;flex:0 0 18px;transition:border-color var(--t-fast) var(--ease)}.tick::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--brand);transform:scale(0);transition:transform var(--t-fast) var(--spring)}.opt.sel .tick{border-color:var(--brand)}.opt.sel .tick::after{transform:scale(1)}
.bar{display:none!important}
.slide{position:relative}
.state-card{position:relative}
.cardbar{height:4px;border-radius:99px;background:rgba(15,107,255,.08);overflow:hidden;margin-bottom:16px}
.cardbar i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .3s var(--spring)}
.multi-step .field{margin-top:10px}.multi-step .block{margin-top:22px;padding-top:20px;border-top:1px solid #edf0f6}.multi-step .block:first-child{margin-top:12px;padding-top:0;border-top:0}.multi-step .sublabel{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:12px;padding-inline-start:12px;border-inline-start:4px solid var(--brand);line-height:1.55}
.phone-row{display:flex;gap:8px;direction:ltr;align-items:stretch}
.ccwrap{flex:0 0 132px}
.ccbtn{width:132px;height:100%;display:flex;align-items:center;gap:7px;cursor:pointer;direction:ltr;text-align:left;padding:11px 10px}
.ccbtn .chev{margin-left:auto;color:var(--faint);font-size:11px}
img.flag{width:20px;height:20px;display:block;object-fit:contain}.emoji{width:1.15em;height:1.15em;vertical-align:-.18em;display:inline-block}
.cclist{display:none;margin-top:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;max-height:250px;overflow:auto}
.cclist.open{display:block}
.ccitem{display:flex;align-items:center;gap:10px;padding:9px 13px;cursor:pointer;font-size:13px;direction:ltr}
.ccitem:hover{background:#f5f8ff}
.ccitem .cname{margin-left:auto;font-family:var(--ar);color:#4a5160}
.phone-row input.tin{flex:1;direction:ltr;text-align:left;font-family:var(--mono);letter-spacing:.03em}
.otherwrap{max-height:0;overflow:hidden;opacity:0;transition:max-height var(--t-med) var(--ease),opacity var(--t-med) var(--ease)}.otherwrap.on{max-height:110px;opacity:1;margin-top:8px}.opts.bad-group .opt{border-color:#e59a95;background:#fffafa}
.emsg{color:var(--err);font-size:13px;margin-top:11px;min-height:16px;display:none}.emsg.on{display:block;animation:rise .28s var(--spring) both}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;flex-shrink:0}.nav.one{justify-content:flex-end}
.btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 26px;border-radius:60px;border:0;font-family:var(--ar);font-weight:650;font-size:15px;cursor:pointer;transition:transform var(--t-fast) var(--ease),background var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),opacity var(--t-fast)}
.btn:active{transform:scale(.9);opacity:.8;transition-duration:90ms}.btn.prim{background:var(--btn);color:#fff;min-width:142px;box-shadow:0 9px 20px -14px rgba(0,75,210,.9)}.btn.prim:hover{background:#0052d6}.btn.ghost{background:#fff;color:#343a46;border:1.5px solid var(--line)}.btn.ghost:hover{background:#fafbfc;border-color:#ced4df}.btn:disabled{opacity:.7;cursor:wait}
.wel .qh{font-size:clamp(21px,4vw,26px)}.wel .hint{font-size:14px;color:var(--soft);font-weight:400}.meta{margin-top:17px;font-family:var(--mono);font-size:12px;color:var(--faint);direction:ltr}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:#fff;margin:0 1.5px;animation:dot 1.1s ease-in-out infinite}.dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}@keyframes dot{0%,100%{opacity:.3}40%{opacity:1}}
.state{display:none;min-height:100dvh;align-items:center;justify-content:center;padding:36px 20px}.state.on{display:flex;animation:rise .5s var(--spring) both}.state-card{width:min(580px,100%);text-align:center;padding:38px 30px}.booking .state-card{width:min(980px,100%);text-align:right}.booking-head{text-align:center;max-width:680px;margin:0 auto 22px}.state .ic{width:66px;height:66px;border-radius:50%;background:#eef4ff;color:var(--brand);display:grid;place-items:center;margin:0 auto 20px;font-size:28px;font-weight:700}.state.done .ic{background:#e9f7f0;color:var(--ok)}.state h2{font-family:'Thmanyah Serif Display',serif;font-size:clamp(20px,4vw,25px);line-height:1.45;text-wrap:balance}.state p{color:#343a46;font-size:14px;margin-top:10px;line-height:1.75}.state .note{margin-top:16px;padding:13px 15px;border-radius:13px;background:#f7f9fd;border:1px solid #e7ebf3;color:#3f4654;font-size:13.5px;text-align:center}.state .actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}.state .actions .btn{width:100%}.tiny{font-size:12px!important;color:var(--faint)!important;margin-top:11px!important}.calendar-shell{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff;min-height:650px;box-shadow:0 10px 30px -28px rgba(25,38,72,.35)}.calendar-shell iframe{display:block;width:100%;height:690px;border:0;background:#fff}.booking-confirm{margin-top:16px;display:grid;gap:10px}.booking-confirm .btn{width:100%}.fallback-link{display:inline-block;margin-top:10px;color:var(--brand-ink);font-size:12.5px;font-weight:600;text-decoration:none}.fallback-link:hover{text-decoration:underline}.done .state-card{position:relative;overflow:hidden;padding:46px 34px}.done .ic{animation:successPop .72s var(--spring) both}.done h2{font-size:clamp(22px,4vw,28px)}.done-title{display:flex;align-items:center;justify-content:center;gap:10px;direction:rtl;white-space:nowrap}.done-title .party{display:inline-block;line-height:1;transform:translateY(-1px)}.done-copy{max-width:680px;margin:14px auto 0!important;font-size:16px!important;line-height:1.9!important;text-wrap:balance;color:#343a46!important}.thanks{font-size:18px!important;font-weight:700;color:#171a20!important}.celebration{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:90;display:none}.celebration.on{display:block}.confetti{position:absolute;top:-22px;width:9px;height:16px;border-radius:3px;background:var(--brand);opacity:.9;animation:confettiFall 1.65s var(--ease) both}.confetti:nth-child(2n){background:#12a66a}.confetti:nth-child(3n){background:#ffb020}.confetti:nth-child(4n){background:#8b5cf6}.confetti:nth-child(5n){background:#ff5d6c}@keyframes successPop{0%{opacity:0;transform:scale(.45) rotate(-12deg)}60%{opacity:1;transform:scale(1.12) rotate(3deg)}100%{transform:scale(1) rotate(0)}}@keyframes confettiFall{0%{opacity:0;transform:translateY(-4vh) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translateY(112vh) rotate(560deg)}}
@media(max-width:560px){
  .opts.cols{grid-template-columns:1fr}
  .slide{padding:18px 15px 15px}
  .stage-wrap{padding:12px 9px}
  /* هرمية القراءة: رقم السؤال ← العنوان ← التوضيح ← الخيارات ← الأزرار */
  .cstep{font-size:11px;margin-bottom:9px;letter-spacing:.06em}
  .qh{font-size:22px;line-height:1.38;font-weight:700;letter-spacing:-.02em}
  .hint{font-size:14.5px;line-height:1.75;margin-top:9px;font-weight:400;color:var(--soft)}
  .field{margin-top:18px}
  .block{margin-top:16px}
  .sublabel{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:8px}
  .subhint{font-size:12.5px}
  .formula{padding:12px 13px;margin:12px 0 2px;font-size:13.5px;line-height:1.95;border-radius:12px}
  .formula::before{font-size:12px}
  .tin{font-size:16px;padding:11px 13px;border-radius:12px}
  textarea.tin{line-height:1.6;font-size:16px}
  .slide.business-step textarea.tin{min-height:64px}
  .opt{min-height:50px;padding:11px 13px;border-radius:12px;gap:10px}
  .opt .tx{font-size:15px;font-weight:500;line-height:1.5}
  .tick{width:19px;height:19px;flex:0 0 19px}
  .example{margin-top:12px;padding-top:11px}
  .example summary{font-size:13.5px}
  .example .example-body{font-size:12.5px;padding:10px 12px}
  .emsg{font-size:12.5px}
  .nav{margin-top:16px;gap:9px}
  .nav .btn{padding:0 20px}
  .btn{height:48px;font-size:15px}
  .cardbar{margin-bottom:12px;height:3px}
  .multi-step .block{margin-top:16px;padding-top:14px}
  .multi-step .sublabel{font-size:15.5px;margin-bottom:9px;padding-inline-start:10px;border-inline-start-width:3px}
  .wel .qh{font-size:21px}
  .wel .hint{font-size:14.5px}
  .meta{margin-top:9px;font-size:10px}
  .state-card{padding:22px 15px}
  .booking .state-card{padding:16px 9px}
  .calendar-shell{min-height:520px;border-radius:12px}
  .calendar-shell iframe{height:560px}
  .done .state-card{padding:28px 17px}
  .done-copy{font-size:14px!important;margin-top:10px!important;line-height:1.8!important}
  .state h2{font-size:21px}
  .state p{font-size:14px;margin-top:9px;line-height:1.75}
  .state .ic{width:54px;height:54px;font-size:23px;margin-bottom:15px}
  .state .note{font-size:12.5px;padding:12px 14px}
  .thanks{font-size:15.5px!important}
}


/* كارد البداية · بأسلوب كارد الحجز والشكر */
.slide.wel{text-align:center;padding:40px 30px 34px;align-items:stretch}
.wel-ic{width:64px;height:64px;border-radius:50%;background:#eef4ff;display:grid;place-items:center;margin:6px auto 20px;animation:successPop .6s var(--spring) both}
.wel-ic svg{width:29px;height:29px;stroke:var(--brand);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.slide.wel .qh{margin:0 auto;max-width:22ch}
.slide.wel .hint{margin:11px auto 0;max-width:34ch}
.wel-note{margin:20px auto 0;padding:11px 15px;border-radius:13px;background:#f7f9fd;border:1px solid #e7ebf3;color:#3f4654;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:9px}
.wel-note .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 7px}
.slide.wel .nav{margin-top:24px}
.slide.wel .nav.one{justify-content:stretch}
.slide.wel .nav .btn{width:100%}
@media(max-width:560px){
  .slide.wel{padding:34px 20px 26px}
  .wel-ic{width:56px;height:56px;margin-bottom:16px}
  .wel-ic svg{width:26px;height:26px}
  .wel-note{margin-top:16px;padding:10px 13px;font-size:12px}
  .slide.wel .nav{margin-top:20px}
}
/* انتقال ناعم بالتلاشي (الجوال) */
@media(max-width:560px){
  .slide.in{animation:fadeIn .34s var(--ease) .05s both}
  .slide.out{animation:fadeOut .17s var(--ease) both}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}


/* زر ابدأ · نفس ستايل زر الموقع (هالة + سويب) */
.slide.wel .btn.prim{position:relative;overflow:hidden;box-shadow:0 0 18px rgba(46,133,255,.38),inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(0,0,0,.1);transition:transform .2s var(--ease),box-shadow .25s var(--ease),opacity var(--t-fast)}
.slide.wel .btn.prim:hover{transform:scale(1.04);box-shadow:0 0 28px rgba(46,133,255,.5),inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.12)}
.slide.wel .btn.prim::after{content:'';position:absolute;top:0;left:150%;width:60%;height:100%;pointer-events:none;background:linear-gradient(240deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(20deg);transition:left 650ms ease}
.slide.wel .btn.prim:hover::after{left:-100%}
html.darija .slide.wel .btn.prim::after{left:-100%;transform:skewX(-20deg);background:linear-gradient(120deg,transparent,rgba(255,255,255,.5),transparent)}
html.darija .slide.wel .btn.prim:hover::after{left:150%}
.slide.wel .btn.prim:active{transform:scale(.9);opacity:.8;transition-duration:90ms}
@media(prefers-reduced-motion:reduce){.slide.wel .btn.prim::after{display:none}.slide.wel .btn.prim:hover{transform:none}}

/* ===== وضع الدمج داخل صفحة الهبوط ===== */
html.embedded, html.embedded body{background:transparent;min-height:0}
html,body{overflow-x:hidden;max-width:100%}
.slide,.state-card{max-width:100%}
html.embedded .bar{display:none}
html.embedded .stage-wrap{min-height:0;padding:6px 2px 26px;align-items:flex-start}
html.embedded .stage{max-width:820px}
html.embedded .state{min-height:0;padding:6px 2px 26px}
html.embedded .booking .state-card{width:100%}
html.embedded .celebration{display:none!important}
html.darija .qh,html.darija .state h2{font-family:var(--ar)}
html.darija .formula::before{content:"Formula t3awnek"}
html.darija .done-title{direction:ltr}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){
  .slide.in{animation:fade .3s var(--ease) both}.slide.out{animation:sink .14s var(--ease) both}.state.on{animation:fade .32s var(--ease) both}.emsg.on{animation:none}
  .confetti{animation:none;display:none}
}
</style>
</head>
<body>
<div class="bar"><i id="pfill"></i></div>
<main class="stage-wrap" id="stageWrap"><div class="stage" id="stage"></div></main>

<section class="state booking" id="bookingState">
  <div class="state-card">
    <div class="cardbar"><i style="width:100%"></i></div>
    <div class="booking-head">
      <div class="ic">1</div>
      <h2>بقيت خطوة واحدة فقط.</h2>
      <p><b>احجز موعد الاستشارة</b></p>
    </div>
    <div class="calendar-shell">
      <iframe id="bookingFrame" title="حجز موعد الاستشارة" loading="eager" referrerpolicy="no-referrer-when-downgrade" allow="payment" src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ0kC0AHIpWvHbYfTznQ66SUw44Bkxh6G8sI-1j_2R0jr9EioCA8g71SQFXhGoSItOMhOyiF5H2v?gv=true"></iframe>
    </div>
    <div class="booking-confirm">
      <button class="btn prim" id="confirmBooking">حجزت الموعد بالفعل ✓</button>
      <a class="fallback-link" id="bookingFallback" href="https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ0kC0AHIpWvHbYfTznQ66SUw44Bkxh6G8sI-1j_2R0jr9EioCA8g71SQFXhGoSItOMhOyiF5H2v" target="_blank" rel="noopener">إذا لم يظهر التقويم، افتح صفحة الحجز في نافذة جديدة ↗</a>
    </div>
    <div class="note"><b>لن يكتمل طلب الاستشارة حتى تختار موعدًا للمكالمة.</b></div>
  </div>

const flagIMG=e=>APPLE[e]?`<img class="flag" src="${APPLE[e]}" alt="">`:`<span class="flag">${e}</span>`;
document.querySelectorAll('[data-emo]').forEach(el=>{const u=APPLE[el.dataset.emo];if(u)el.innerHTML='<img class="emoji" src="'+u+'" alt="">';});
function renderField(step,f){
 const key=inputKey(step,f),v=data[key]??'';let h=`<div class="block ${f.short?'short':''}" data-block="${esc(key)}">`;
 if(f.label)h+=`<div class="sublabel">${esc(f.label)}${f.req?' <span class="req">*</span>':''}</div>`;
 if(f.subhint)h+=`<div class="subhint">${esc(f.subhint)}</div>`;
 if(f.type==='textarea'){const _rows=matchMedia('(max-width:560px)').matches?2:Math.max(3,String(f.ph||'').split('\n').length+1);h+=`<textarea class="tin" rows="${_rows}" data-key="${esc(key)}" ${f.dir==='ltr'?'dir="ltr"':'dir="auto"'} placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;}
 else if(f.type==='radio'){
   h+=`<div class="opts ${(f.cols||f.opts.length>5)?'cols':''}" data-radio="${esc(key)}">`;
   f.opts.forEach(o=>h+=radioOption(key,o,v===o));
   if(f.other)h+=radioOption(key,'__other__',v==='__other__',TT().other);
   h+='</div>';
   if(f.other){const ov=data[key+'__other']??'';h+=`<div class="otherwrap ${v==='__other__'?'on':''}" data-other-for="${esc(key)}"><input class="tin" data-other-key="${esc(key+'__other')}" value="${esc(ov)}" placeholder="${TT().otherPh}"></div>`;}
 } else if(f.type==='tel'){
   const cc=data[key+'_cc']||'+212', num=data[key+'_num']||'';
   const cur=CCS.find(o=>o[3]===cc)||CCS[0];
   h+=`<div class="phone-row"><div class="ccwrap"><button type="button" class="tin ccbtn" data-ccbtn="${esc(key)}">${flagIMG(cur[0])}<span class="mono ccv">${esc(cc)}</span><span class="chev">▾</span></button></div><input class="tin" data-tel="${esc(key)}" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="612345678" value="${esc(num)}"></div><div class="cclist" data-cclist="${esc(key)}">${CCS.map(o=>`<div class="ccitem" data-cc-val="${o[3]}" data-cc-flag="${o[0]}">${flagIMG(o[0])}<span class="mono">${o[3]}</span><span class="cname">${LANG==='darija'?o[2]:o[1]}</span></div>`).join('')}</div>`;
 } else {
   const type=f.type==='email'?'email':'text';
   h+=`<input class="tin" data-key="${esc(key)}" ${f.dir==='ltr'?'dir="ltr"':''} type="${type}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
 }
 h+='</div>';return h;
}
function radioOption(key,value,on,label){return `<label class="opt ${on?'sel':''}"><span class="tx">${esc(label||value)}</span><span class="tick"></span><input type="radio" name="${esc(key)}" value="${esc(value)}" ${on?'checked':''}></label>`;}
function autosize(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';}
function wire(step){
 const all=$('stage').querySelectorAll('[data-key]');all.forEach((el,i)=>{if(i===0)el.setAttribute('data-focus','');el.addEventListener('input',()=>{data[el.dataset.key]=el.value;save();el.classList.remove('bad');clearErr();if(el.tagName==='TEXTAREA'){autosize(el);postH();}});});
 $('stage').querySelectorAll('textarea.tin').forEach(t=>{if(t.value)autosize(t);});
 $('stage').querySelectorAll('[data-tel]').forEach(el=>{
   const key=el.dataset.tel;
   const btn=$('stage').querySelector(`[data-ccbtn="${cssEsc(key)}"]`);
   const list=$('stage').querySelector(`[data-cclist="${cssEsc(key)}"]`);
   const commit=()=>{const num=el.value.replace(/\D/g,'').slice(0,12);if(el.value!==num)el.value=num;
     const cc=data[key+'_cc']||'+212';
     data[key+'_num']=num;data[key+'_cc']=cc;data[key]=num?(cc+' '+num):'';save();el.classList.remove('bad');clearErr();};
   el.addEventListener('input',commit);
   btn.addEventListener('click',()=>{list.classList.toggle('open');postH();});
   list.querySelectorAll('.ccitem').forEach(it=>it.addEventListener('click',()=>{
     data[key+'_cc']=it.dataset.ccVal;
     btn.innerHTML=flagIMG(it.dataset.ccFlag)+'<span class="mono ccv">'+it.dataset.ccVal+'</span><span class="chev">▾</span>';
     list.classList.remove('open');commit();postH();
   }));
 });
 $('stage').querySelectorAll('[data-radio]').forEach(grp=>{grp.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{const key=grp.dataset.radio;data[key]=inp.value;grp.classList.remove('bad-group');grp.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.querySelector('input').checked));const ow=$('stage').querySelector(`[data-other-for="${cssEsc(key)}"]`);if(ow){const on=inp.value==='__other__';ow.classList.toggle('on',on);if(on)setTimeout(()=>ow.querySelector('input').focus(),120);}save();clearErr();}));});
 $('stage').querySelectorAll('[data-other-key]').forEach(el=>el.addEventListener('input',()=>{data[el.dataset.otherKey]=el.value;save();el.classList.remove('bad');clearErr();}));
}
function cssEsc(s){return String(s).replace(/(["\\])/g,'\\$1');}
function clearErr(){const e=$('emsg');if(e)e.classList.remove('on');}
function showErr(m){const e=$('emsg');if(e){e.textContent=m;e.classList.add('on');}}
function clearBad(){$('stage').querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));$('stage').querySelectorAll('.bad-group').forEach(x=>x.classList.remove('bad-group'));}
function validate(){
 clearBad();const q=stepIndex();let first=null,emsgTxt=null;
 for(const f of q.fields){const key=inputKey(q,f),v=data[key];
   if(f.type==='email'){
     const text=String(v??'').trim();
     if(text && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(text)){
       const el=$('stage').querySelector(`[data-key="${cssEsc(key)}"]`);
       if(el){el.classList.add('bad');if(!first){first=el;emsgTxt=TT().emailMsg;}}
       continue;
     }
     if(!f.req)continue;
     if(!text){const el=$('stage').querySelector(`[data-key="${cssEsc(key)}"]`);if(el){el.classList.add('bad');if(!first)first=el;}}
     continue;
   }
   if(!f.req)continue;
   if(f.type==='radio'){
     if(!v){const grp=$('stage').querySelector(`[data-radio="${cssEsc(key)}"]`);if(grp){grp.classList.add('bad-group');if(!first)first=grp;}continue;}
     if(v==='__other__'&&!(data[key+'__other']||'').trim()){const el=$('stage').querySelector(`[data-other-key="${cssEsc(key+'__other')}"]`);if(el){el.classList.add('bad');if(!first)first=el;}}
   }else if(f.type==='tel'){
     const num=(data[key+'_num']||'').trim();
     const el=$('stage').querySelector(`[data-tel="${cssEsc(key)}"]`);
     if(num.length<6||num.length>12||/\D/.test(num)){if(el){el.classList.add('bad');if(!first)first=el;}}
   }else{
     const text=String(v??'').trim();const el=$('stage').querySelector(`[data-key="${cssEsc(key)}"]`);
     if(!text){if(el){el.classList.add('bad');if(!first)first=el;}continue;}
     if(f.type==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(text)){if(el){el.classList.add('bad');if(!first)first=el;}}
   }
 }
 if(first){if(!EMBED)first.scrollIntoView({behavior:'smooth',block:'center'});if(first.focus)first.focus();
   return emsgTxt||(first.hasAttribute&&first.hasAttribute('data-tel')?TT().telMsg:TT().fillMsg);}
 return null;
}
function transitionOut(cb){const s=$('stage').querySelector('.slide');if(!s){cb();return;}let fired=false;const done=()=>{if(fired)return;fired=true;s.removeEventListener('animationend',done);cb();};s.classList.remove('in');s.classList.add('out');s.addEventListener('animationend',done);setTimeout(done,200);}
let navved=false;
function centerStage(){if(!navved)return;requestAnimationFrame(()=>{if(EMBED){try{parent.postMessage({type:'consult:center'},'*');}catch(_){}return;}const el=($('stageWrap').style.display==='none')?document.querySelector('.state.on .state-card'):$('stage');if(!el)return;const r=el.getBoundingClientRect();const y=window.scrollY+r.top-Math.max(16,(innerHeight-r.height)/2);window.scrollTo({top:Math.max(0,y),behavior:'smooth'});});}
function go(){if(busy)return;navved=true;const err=validate();if(err){showErr(err);return;}if(qi===STEPS.length-1){submit();return;}busy=true;transitionOut(()=>{qi++;render();busy=false;});}
function back(){if(busy||qi<=1)return;navved=true;busy=true;transitionOut(()=>{qi--;render();busy=false;});}
document.addEventListener('keydown',e=>{if($('bookingState').classList.contains('on')||$('doneState').classList.contains('on'))return;if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();go();}});

function leadToken(){let t=localStorage.getItem(LS+'_token');if(!t){t='lead_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10);localStorage.setItem(LS+'_token',t);}return t;}
function buildPayload(){return {
 form_version:'7q_booking_v2_embed',lead_token:leadToken(),
 contact_name:data.contact_name||'',contact_email:data.contact_email||'',contact_phone:data.contact_phone||'',contact_main_link:data.contact_main_link||'',
 business_profile:data.business_profile||'',content_current:data.content_current||'',operation_current_and_past:data.operation_current_and_past||'',
 change_from:data.change_from||'',change_to:data.change_to||'',trigger_reason:data.trigger_reason||'',
 source_channel:data.source_channel==='__other__'?(data.source_channel__other||TT().other):(data.source_channel||''),
 decision_authority:data.investment_decision||'',monthly_budget:data.investment_budget||'',
 prep_offer:data.prep_offer||'',prep_social:data.prep_social||'',
 booking_status:'awaiting_booking',booking_url:BOOKING_URL,submittedAt:new Date().toISOString(),ua:navigator.userAgent.slice(0,160)
};}
async function createLead(payload){
 const body=JSON.stringify({fields:toFirestoreFields(payload)});let last='';
 for(const dbid of FS_DBS){const res=await fetch(fsDocs(dbid)+'/'+COLLECTION+'?key='+firebaseConfig.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body});if(res.ok){const j=await res.json();return {dbid,name:j.name||''};}const t=await res.text();if(res.status!==404)throw new Error('HTTP '+res.status+' · '+t.slice(0,120));last='HTTP 404';}
 throw new Error('قاعدة البيانات غير موجودة ('+last+')');
}
async function patchLead(fields){
 if(!submittedDocPath)return false;const parts=submittedDocPath.split('/');const di=parts.indexOf('databases');const dbid=di>=0?parts[di+1]:'(default)';const docPath=parts.slice(parts.indexOf('documents')+1).join('/');if(!docPath)return false;
 const masks=Object.keys(fields).map(k=>'updateMask.fieldPaths='+encodeURIComponent(k)).join('&');
 const url=fsDocs(dbid)+'/'+docPath+'?'+masks+'&key='+firebaseConfig.apiKey;
 try{const res=await fetch(url,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:toFirestoreFields(fields)})});return res.ok;}catch(_){return false;}
}
async function submit(){
 const b=$('nextBtn');b.disabled=true;b.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';const payload=buildPayload();
 try{const r=await createLead(payload);submittedDocPath=r.name;localStorage.setItem(LS+'_doc',submittedDocPath);localStorage.setItem(LS+'_payload',JSON.stringify(payload));}
 catch(e){console.error('submit error:',e);localStorage.setItem(LS+'_pending',JSON.stringify(payload));}
 showBooking();
}
function showBooking(){postH();localStorage.setItem(LS+'_stage','booking');$('stageWrap').style.display='none';$('bookingState').classList.add('on');$('pfill').style.width='100%';postH();centerStage();patchLead({booking_status:'booking_page_shown',bookingOpenedAt:new Date().toISOString()});}
$('bookingFallback').href=BOOKING_URL;
$('confirmBooking').addEventListener('click',async()=>{const b=$('confirmBooking');b.disabled=true;b.textContent=TT().confirming;const now=new Date().toISOString();const token=leadToken();await patchLead({booking_status:'confirmed_by_user',bookingConfirmedAt:now});try{await createLead({record_type:'booking_confirmation',lead_token:token,contact_email:data.contact_email||'',contact_phone:data.contact_phone||'',booking_status:'confirmed_by_user',bookingConfirmedAt:now,submittedAt:now});}catch(e){console.warn('booking event fallback failed',e);}localStorage.setItem(LS+'_booking_confirmed',now);showDone();});
function showDone(){ if(EMBED){ try{ parent.postMessage({type:'consult:done'}, '*'); }catch(_){} } const cel=$('celebration');if(cel&&!EMBED)cel.classList.add('on');localStorage.removeItem(LS);localStorage.removeItem(LS+'_stage');localStorage.removeItem(LS+'_doc');localStorage.removeItem(LS+'_payload');localStorage.removeItem(LS+'_token');$('bookingState').classList.remove('on');$('doneState').classList.add('on');if(!EMBED)window.scrollTo({top:0,behavior:'smooth'});postH();if(EMBED)centerStage();}

function applyLangForm(l){
 LANG=(l==='darija')?'darija':'ar';
 STEPS=(LANG==='darija')?DR_STEPS:AR_STEPS;
 counted=STEPS.filter(x=>x.n).length;
 const d=document.documentElement;
 d.lang=(LANG==='darija')?'ary-Latn':'ar'; d.dir=(LANG==='darija')?'ltr':'rtl';
 d.classList.toggle('darija',LANG==='darija');
 document.title=TT().title;
 const B=TT();
 const b1=document.querySelector('#bookingState h2'); if(b1)b1.textContent=B.bookingH2;
 const b2=document.querySelector('#bookingState .booking-head p b'); if(b2)b2.textContent=B.bookingSub;
 const b3=$('confirmBooking'); if(b3&&!b3.disabled)b3.textContent=B.bookingBtn;
 const b4=$('bookingFallback'); if(b4)b4.textContent=B.bookingFallback;
 const b5=document.querySelector('#bookingState .note b'); if(b5)b5.textContent=B.bookingNote;
 const d1=document.querySelector('.done-title span:first-child'); if(d1)d1.textContent=B.doneH2;
 const d2=document.querySelector('.thanks'); if(d2&&d2.firstChild)d2.firstChild.nodeValue=B.thanks;
 const d3=document.querySelector('.done-copy'); if(d3)d3.textContent=B.doneCopy;
 if(!$('bookingState').classList.contains('on')&&!$('doneState').classList.contains('on'))render();
 postH();
}
window.addEventListener('message',e=>{const m=e.data;if(m&&m.type==='consult:lang')applyLangForm(m.lang);});
if(LANG==='darija')applyLangForm('darija');
if(localStorage.getItem(LS+'_stage')==='booking')showBooking();else render();
</script>
