<style>
/* فقط تنسيق الصفحة الجديدة وحالة ما بعد الإرسال */
body {
  min-height: 100vh;
}

.progress-page-main {
  padding-top: 72px;
  padding-bottom: 96px;
}

.progress-page-hero {
  width: min(900px, calc(100% - 40px));
  margin: 0 auto 26px;
  text-align: center;
}

.progress-page-hero h1 {
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
  letter-spacing: -.04em;
}

.progress-page-hero .headline-main {
  display: block;
  color: #111;
  font-size: clamp(30px, 3.1vw, 42px);
  font-weight: 500;
  line-height: 1.16;
}

.progress-page-hero .headline-accent {
  display: block;
  margin-top: 3px;
  color: #0f6bff;
  font-size: clamp(60px, 6.9vw, 90px);
  font-weight: 700;
  line-height: .98;
  letter-spacing: -.055em;
  white-space: nowrap;
}

.progress-page-hero p {
  max-width: 700px;
  margin: 18px auto 0;
  color: #64748b;
  font-size: clamp(14px, 1.2vw, 16px);
  line-height: 1.7;
}

body.submitted .progress-page-hero { display: none; }
@media (max-width: 640px) {
  .progress-page-hero .headline-main {
    font-size: 24px;
    line-height: 1.2;
  }
  .progress-page-hero .headline-accent {
    margin-top: 3px;
    font-size: clamp(42px, 12.5vw, 56px);
    line-height: 1;
    white-space: normal;
  }
  .progress-page-hero p {
    max-width: 94%;
    margin-top: 15px;
    font-size: 14px;
    line-height: 1.7;
  }
  .progress-page-main {
    padding-top: 42px;
    padding-bottom: 64px;
  }
  .progress-page-hero {
    width: min(100% - 30px, 720px);
    margin-bottom: 28px;
  }

}

html.has-tracking-token .progress-page-hero,
html.has-tracking-token #formView {
  display: none !important;
}
</style>
<script>
if (new URLSearchParams(location.search).has('token')) document.documentElement.classList.add('has-tracking-token');
</script>

<body class="rtl">
<main class="progress-page-main">

      <span class="headline-accent">ما الخطوة التالية؟</span>
    </h1>
    <p>60 دقيقة نحدد فيها أولويتك وخطوتك التالية، مع خطة عمل واضحة بعد الجلسة.</p>
  </header>
<section id="apply" class="apply consultation-form" aria-label="أرسل الفورم"><p class="form-loading" role="status">جارٍ تحميل الفورم…</p><noscript><a href="../">فتح صفحة الاستشارة</a></noscript></section>
</main>
</body>
